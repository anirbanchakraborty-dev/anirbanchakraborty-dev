<svg xmlns="http://www.w3.org/2000/svg" width="860" height="350" viewBox="0 0 860 350" role="img" aria-labelledby="t d"><title id="t">tree-sitter-lilypond against nwhetsell&#x27;s grammar</title><desc id="d">Three criteria, each with its own scale: Accepted files with an error, fewer is better: this grammar 6, nwhetsell 2, fails; Throughput, nwhetsell timed with its embedded Scheme grammar: this grammar 26,112 bytes/ms, nwhetsell 15,593 bytes/ms, passes; Broken files caught within one line of LilyPond&#x27;s error: this grammar 30 of 36, nwhetsell 16 of 36, passes.</desc><style>@font-face{font-family:PM;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:PS;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:PS;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}.ps{font-family:PS,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.pm{font-family:PM,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><rect x="0.5" y="0.5" width="859" height="349" rx="12" fill="#fbf8f1" stroke="#c8bea9"/><text x="28.0" y="40.0" class="ps" font-size="17" font-weight="600" fill="#1c1a16">Against the other LilyPond grammar</text><text x="28.0" y="62.0" class="ps" font-size="12.5" fill="#3b372f">This grammar and nwhetsell&#x27;s tree-sitter-lilypond on the same corpus. Each row has its own scale. The figures are the comparison table in this</text><text x="28.0" y="80.0" class="ps" font-size="12.5" fill="#3b372f">README.</text><rect x="28" y="94" width="12" height="12" rx="3" fill="#007ea6"/><text x="46.0" y="104.0" class="ps" font-size="12" fill="#1c1a16">This grammar</text><rect x="142.268" y="94" width="12" height="12" rx="3" fill="#5a5448"/><text x="160.3" y="104.0" class="ps" font-size="12" fill="#1c1a16">nwhetsell</text><line x1="28" y1="118" x2="832" y2="118" stroke="#e0d8c6"/><text x="28.0" y="142.0" class="ps" font-size="12.5" fill="#1c1a16">Accepted files with an error, fewer is better</text><path d="M388.0,133.0h237.8a4.0,4.0 0 0 1 4.0,4.0v4.0a4.0,4.0 0 0 1 -4.0,4.0h-237.8z" fill="#007ea6"/><text x="637.8" y="143.5" class="pm" font-size="11" font-weight="500" fill="#1c1a16">6</text><path d="M388.0,155.0h76.6a4.0,4.0 0 0 1 4.0,4.0v4.0a4.0,4.0 0 0 1 -4.0,4.0h-76.6z" fill="#5a5448"/><text x="476.6" y="165.5" class="pm" font-size="11" font-weight="500" fill="#1c1a16">2</text><circle cx="768.825" cy="150" r="8" fill="#a1211f"/><path d="M765.825,147 l6,6 M771.825,147 l-6,6" stroke="#fbf8f1" stroke-width="1.8" stroke-linecap="round"/><text x="783.8" y="154.5" class="ps" font-size="12.5" font-weight="600" fill="#1c1a16">fails</text><line x1="28" y1="192" x2="832" y2="192" stroke="#e0d8c6"/><text x="28.0" y="216.0" class="ps" font-size="12.5" fill="#1c1a16">Throughput, nwhetsell timed with its embedded Scheme</text><text x="28.0" y="233.0" class="ps" font-size="12.5" fill="#1c1a16">grammar</text><path d="M388.0,207.0h237.8a4.0,4.0 0 0 1 4.0,4.0v4.0a4.0,4.0 0 0 1 -4.0,4.0h-237.8z" fill="#007ea6"/><text x="637.8" y="217.5" class="pm" font-size="11" font-weight="500" fill="#1c1a16">26,112 bytes/ms</text><path d="M388.0,229.0h140.4a4.0,4.0 0 0 1 4.0,4.0v4.0a4.0,4.0 0 0 1 -4.0,4.0h-140.4z" fill="#5a5448"/><text x="540.4" y="239.5" class="pm" font-size="11" font-weight="500" fill="#1c1a16">15,593 bytes/ms</text><circle cx="768.825" cy="224" r="8" fill="#00614a"/><path d="M765.225,224 l2.6,2.8 l4.8,-5.4" fill="none" stroke="#fbf8f1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="783.8" y="228.5" class="ps" font-size="12.5" font-weight="600" fill="#1c1a16">passes</text><line x1="28" y1="266" x2="832" y2="266" stroke="#e0d8c6"/><text x="28.0" y="290.0" class="ps" font-size="12.5" fill="#1c1a16">Broken files caught within one line of LilyPond&#x27;s error</text><path d="M388.0,281.0h197.5a4.0,4.0 0 0 1 4.0,4.0v4.0a4.0,4.0 0 0 1 -4.0,4.0h-197.5z" fill="#007ea6"/><text x="597.5" y="291.5" class="pm" font-size="11" font-weight="500" fill="#1c1a16">30 of 36</text><path d="M388.0,303.0h103.5a4.0,4.0 0 0 1 4.0,4.0v4.0a4.0,4.0 0 0 1 -4.0,4.0h-103.5z" fill="#5a5448"/><text x="503.5" y="313.5" class="pm" font-size="11" font-weight="500" fill="#1c1a16">16 of 36</text><circle cx="768.825" cy="298" r="8" fill="#00614a"/><path d="M765.225,298 l2.6,2.8 l4.8,-5.4" fill="none" stroke="#fbf8f1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="783.8" y="302.5" class="ps" font-size="12.5" font-weight="600" fill="#1c1a16">passes</text></svg>