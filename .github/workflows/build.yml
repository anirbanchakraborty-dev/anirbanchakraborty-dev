# Redraws every card on the profile once a day.
#
# build/build.py reads the public repositories, the contribution calendar and
# the website's feed, writes the SVGs into dist/, and refreshes the generated
# blocks of README.md. The snake is drawn from the same calendar. The SVGs are
# published as the only commit on the `output` branch, so the history of main
# holds README changes alone and never a stack of regenerated images.
#
# A failed fetch fails the run and leaves the previous cards in place.

name: Build profile

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: build/requirements.txt

      - name: Install font tooling
        run: python -m pip install --disable-pip-version-check -r build/requirements.txt

      - name: Draw the cards and refresh the README blocks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build/build.py

      - name: Draw the contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#00614a&color_dots=#ebe5d7,#7bbccf,#3d9ab6,#16809e,#005f7a
            dist/snake-dark.svg?palette=github-dark&color_snake=#00c48c&color_dots=#0d2a5c,#0b4f7a,#0a7fb0,#05a6dc,#00c7fd

      - name: Publish the cards to the output branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          export GIT_INDEX_FILE="$RUNNER_TEMP/output-index"
          git --work-tree=dist add -A
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -m "Cards drawn on $(date -u +%F)")
          git push --force origin "$commit:refs/heads/output"

      - name: Commit the README if its blocks changed
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if git diff --quiet -- README.md; then
            echo "README blocks unchanged"
            exit 0
          fi
          git commit --only README.md -m "chore: refresh profile blocks"
          git push origin HEAD:main
